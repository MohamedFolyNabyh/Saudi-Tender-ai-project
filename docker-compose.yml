services:

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ai_fastapi

    restart: always

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini

    depends_on:
      - postgres
      - redis
      - qdrant


  postgres:
    image: postgres:16

    container_name: ai_postgres

    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:7

    container_name: ai_redis

    restart: always

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data


  qdrant:
    image: qdrant/qdrant:latest

    container_name: ai_qdrant

    restart: always

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage


volumes:

  postgres_data:

  redis_data:

  qdrant_data:

